<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lampcircle</title>
    <meta name="description" content="Live song maps for leading worship in a small room." />
    <meta name="theme-color" content="#FBF7F1" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Lampcircle" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Dark before the first paint, so a dark room never sees a light flash. src/theme.ts keeps it in step.
      let saved = null;
      try {
        saved = localStorage.getItem('lampcircle.theme');
      } catch {}
      if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#070D13');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
